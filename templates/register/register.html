{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trailhead - Create Account</title>
    
    <!-- Third-Party CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Static Local Utilities -->
    <script src="{% static 'js/register/register.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/register/register.css' %}">
</head>
<body class="bg-trail-hero min-h-screen flex items-center justify-center p-4 sm:p-6 antialiased text-slate-800">

    <main class="w-full max-w-md my-6">
        <div class="glass-card rounded-3xl p-8 sm:p-10 transition-all">
            
            <!-- Header Section -->
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-2xl bg-forest-800 text-white flex items-center justify-center mx-auto mb-4 shadow-md">
                    <i data-lucide="mountain-snow" class="w-6 h-6"></i>
                </div>
                <h1 class="text-2xl font-bold text-forest-900 tracking-tight">Share your route</h1>
                <p class="text-xs text-slate-500 mt-1 max-w-xs mx-auto">Create your account to discover and share new hiking routes</p>
            </div>

            <!-- Dynamic Reusable Alert Utility -->
            {% include 'includes/alerts.html' %}

            <!-- Register Form -->
            <form method="POST" action="{% url 'register' %}" class="space-y-4">
                {% csrf_token %}

                <!-- Username Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Username</label>
                    <div class="relative">
                        <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input 
                            type="text" 
                            name="username" 
                            required 
                            placeholder="Erosyonz" 
                            class="input-trail w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:bg-white text-slate-800 placeholder-slate-400"
                        >
                    </div>
                </div>

                <!-- Email Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Email Address</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input 
                            type="email" 
                            name="email" 
                            required 
                            placeholder="erosdelpen@gmail.com" 
                            class="input-trail w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:bg-white text-slate-800 placeholder-slate-400"
                        >
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input 
                            type="password" 
                            id="reg-pass" 
                            name="password" 
                            required 
                            placeholder="At least 8 characters" 
                            minlength="8"
                            class="input-trail w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:bg-white text-slate-800 placeholder-slate-400"
                        >
                        <button type="button" onclick="togglePassword('reg-pass', 'pass-eye-1')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition">
                            <i id="pass-eye-1" data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Confirm Password</label>
                    <div class="relative">
                        <i data-lucide="shield-check" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input 
                            type="password" 
                            id="confirm-pass" 
                            name="confirm_password" 
                            required 
                            placeholder="Repeat password" 
                            class="input-trail w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:bg-white text-slate-800 placeholder-slate-400"
                        >
                        <button type="button" onclick="togglePassword('confirm-pass', 'pass-eye-2')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition">
                            <i id="pass-eye-2" data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <button 
                    type="submit" 
                    class="w-full py-3 px-4 bg-forest-800 hover:bg-forest-900 active:scale-[0.99] text-white rounded-xl font-semibold text-sm shadow-lg shadow-forest-950/20 transition-all flex items-center justify-center gap-2 group mt-3"
                >
                    <span>Start Hiking</span>
                    <i data-lucide="compass" class="w-4 h-4 group-hover:rotate-45 transition-transform"></i>
                </button>
            </form>

            <!-- Footer Link -->
            <div class="mt-6 pt-5 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-500">
                    Already have an account? 
                    <a href="{% url 'login' %}" class="text-terracotta-600 hover:underline font-semibold ml-1">Log in</a>
                </p>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
