<!-- templates/includes/alerts.html -->
{% if messages %}
  <div id="django-alerts-container" class="space-y-3 mb-5" role="status" aria-live="polite">
    {% for message in messages %}
      <div class="alert-item flex items-center justify-between gap-3 rounded-xl border px-4 py-3 text-sm transition-all duration-500
        {% if 'error' in message.tags %}border-red-400/50 bg-red-500/10 text-red-200
        {% elif 'success' in message.tags %}border-emerald-400/50 bg-emerald-500/10 text-emerald-200
        {% else %}border-white/20 bg-white/5 text-zinc-200{% endif %}">

        <span>{{ message }}</span>

        <button type="button" onclick="dismissAlert(this.parentElement)" aria-label="Close message"
          class="shrink-0 opacity-60 hover:opacity-100 transition-opacity">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    {% endfor %}
  </div>

  <script>
    function dismissAlert(element) {
      element.style.opacity = '0';
      element.style.transform = 'translateY(-6px)';
      setTimeout(() => element.remove(), 500);
    }

    // Messages fade out by themselves after a few seconds
    setTimeout(() => {
      document.querySelectorAll('.alert-item').forEach(dismissAlert);
    }, 6000);
  </script>
{% endif %}
