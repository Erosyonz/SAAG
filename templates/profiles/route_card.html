<a href="{% url 'home' %}?route={{ card.id }}"
    class="trail-card group relative flex h-[200px] flex-col justify-end overflow-hidden rounded-2xl border border-white/20 p-5 shadow-2xl">

    <div class="trail-card-fallback absolute inset-0"></div>
    {% if card.cover_image %}
        <img src="{{ card.cover_image }}" alt="" onerror="this.remove()"
            class="absolute inset-0 h-full w-full object-cover transition-transform duration-500 group-hover:scale-105">
    {% endif %}
    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>

    <div class="relative z-10 min-w-0 text-white">
        <span class="mb-2 inline-block rounded-md px-2.5 py-1 text-[11px] font-bold {{ card.badge_class }}">
            {{ card.difficulty }} &middot; {{ card.distance|floatformat:1 }} km
        </span>
        <h4 class="font-display truncate text-lg font-bold leading-snug">{{ card.name }}</h4>
        <p class="mt-0.5 text-xs text-zinc-300">
            {{ card.date|date:"M j, Y" }}{% if card.rating %} &middot; rated {{ card.rating }}/5{% endif %}
        </p>
    </div>
</a>
