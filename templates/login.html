{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trailhead - Sign In</title>
    
    <!-- Third-Party CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Static Local Utilities -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-trail-hero min-h-screen flex items-center justify-center p-4 sm:p-6 antialiased text-slate-800">

    <main class="w-full max-w-md">
        <div class="glass-card rounded-3xl p-8 sm:p-10 transition-all">
            
            <!-- Header Section -->
            <div class="text-center mb-8">
                <div class="w-12 h-12 rounded-2xl bg-forest-800 text-white flex items-center justify-center mx-auto mb-4 shadow-md">
                    <i data-lucide="compass" class="w-6 h-6"></i>
                </div>
                <h1 class="text-2xl font-bold text-forest-900 tracking-tight">SAAG</h1>
                <p class="text-sm text-slate-500 mt-1">Hello, Mag-Balaktasay</p>
            </div>

            <!-- Dynamic Reusable Alert Utility -->
            {% include 'includes/alerts.html' %}

            <!-- Login Form -->
            <form method="POST" action="{% url 'login' %}" class="space-y-5">
                {% csrf_token %}
                
                <!-- Username Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">USERNAME</label>
                    <div class="relative">
                        <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input 
                            type="text" 
                            name="username" 
                            required 
                            placeholder="Erosyonz" 
                            class="input-trail w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:bg-white text-slate-800 placeholder-slate-400"
                        >
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Password</label>
                        <a href="#" onclick="handleForgotPassword(event)" class="text-xs text-terracotta-600 hover:text-terracotta-500 font-medium transition">Forgot Password</a>
                    </div>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input 
                            type="password" 
                            id="login-pass" 
                            name="password" 
                            required 
                            placeholder="••••••••" 
                            class="input-trail w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:bg-white text-slate-800 placeholder-slate-400"
                        >
                        <button type="button" onclick="togglePassword('login-pass', 'pass-eye')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition">
                            <i id="pass-eye" data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me Checkbox -->
                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center gap-2 cursor-pointer text-slate-600 text-xs select-none">
                        <input type="checkbox" name="remember_me" class="w-4 h-4 rounded text-forest-800 focus:ring-forest-800 border-slate-300">
                        <span>Remember my session</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    class="w-full py-3.5 px-4 bg-forest-800 hover:bg-forest-900 active:scale-[0.99] text-white rounded-xl font-semibold text-sm shadow-lg shadow-forest-950/20 transition-all flex items-center justify-center gap-2 group mt-2"
                >
                    <span>Start Exploring</span>
                    <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                </button>
            </form>

            <!-- Footer Link -->
            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-500">
                    Don't have an account? 
                    <a href="{% url 'register' %}" class="text-terracotta-600 hover:underline font-semibold ml-1">Sign up</a>
                </p>
            </div>

        </div>
    </main>

</body>
</html>
