
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SA-AG - Interactive Trail Map</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Mapbox CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css"
          rel="stylesheet" />

    <!-- Mapbox JavaScript -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{% static 'css/home/home.css' %}">

    <!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<!-- Leaflet JavaScript -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

</head>

<body class="bg-gray-100 min-h-screen font-sans text-slate-800">

    <!-- Main Application Layout -->
    <div class="flex h-screen w-full overflow-hidden bg-gray-100">

        <!-- SIDEBAR -->
        <aside id="sidebar-header"
            class="bg-black text-white w-16 shrink-0 flex flex-col justify-between fixed md:relative inset-y-0 left-0 z-30 transition-transform duration-300 ease-in-out -translate-x-full md:translate-x-0">

            <div>

                <!-- Brand Header -->
                <div class="flex items-center justify-between pb-6 mb-6 border-b border-gray-800">

                    <!-- Mobile Close Button -->
                    <button id="close-sidebar-btn"
                        class="md:hidden text-gray-400 hover:text-white focus:outline-none">

                        <svg xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            class="size-6">

                            <path stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M6 18 18 6M6 6l12 12" />

                        </svg>

                    </button>

                </div>

                <!-- Navigation Links -->
                <nav class="space-y-2">

                    <!-- Home -->
                    <a href="#home"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors"
                        data-page="home">

                        <svg xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            class="size-6 shrink-0">

                            <path stroke-linecap="round"
                                stroke-linejoin="round"
                                d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />

                        </svg>

                    </a>

                    <!-- Map Shortcut (Returns to Home Map) -->
                    <a href="#home"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors"
                        data-page="home">

                        <svg xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            class="size-6 shrink-0">

                            <path stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M9 6.75V15m6-6v8.25m.503-11.487 4.5 1.744a.75.75 0 0 1 .497.702v12.247a.75.75 0 0 1-.996.711l-4.5-1.744a.75.75 0 0 0-.504 0l-4.5 1.744a.75.75 0 0 1-.497-.702V4.225a.75.75 0 0 1 .996-.711l4.5 1.744a.75.75 0 0 0 .504 0Z" />

                        </svg>

                    </a>

                    <!-- Profile -->
                    <a href="#profile"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors"
                        data-page="profile">

                        <svg xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            class="size-6 shrink-0">

                            <path stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />

                        </svg>

                    </a>

                </nav>

            </div>

            <!-- Sidebar Footer -->
            <div class="pt-4 border-t border-gray-800 text-xs text-gray-500 p-2">
                &copy; SAAG
            </div>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="flex-1 min-w-0 h-full overflow-hidden m-0 p-0">

            <!-- HOME PAGE -->
            <section id="view-home"
                class="page-view flex flex-col w-full h-full min-w-0 relative overflow-hidden">
                            
                <!-- Map Container filling 100% -->
                <div id="mapbox-container"
                    class="w-full h-full absolute inset-0">

                    <!-- Satellite Mode Indicator -->
                    <div class="absolute top-4 left-4 z-[400] bg-black/80 backdrop-blur-md text-white text-xs px-3 py-2 rounded-full pointer-events-none border border-white/10 shadow-lg flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        Satellite Mode Active
                    </div>

                </div>

                <!-- RIGHT SIDE OVERLAY MODAL -->
                <div id="location-modal" class="absolute top-0 right-0 h-full w-96 bg-white/95 backdrop-blur-md shadow-2xl z-[1000] transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col border-l border-gray-200 pointer-events-auto">
                    <!-- Modal Header -->
                    <div class="flex items-center justify-between p-4 border-b border-gray-100">
                        <h3 class="font-bold text-slate-800 text-lg">Selected Location</h3>
                        <button id="close-modal-btn" class="text-gray-400 hover:text-slate-700 p-1 rounded-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>

                    <!-- Modal Body / Content -->
                    <div class="p-6 flex-1 overflow-y-auto space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 tracking-wider mb-1">Coordinates</label>
                            <p id="modal-coords" class="text-sm font-mono bg-gray-50 p-2.5 rounded-lg border border-gray-200 text-slate-700">-</p>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 tracking-wider mb-1">Location Title / Name</label>
                            <input type="text" id="modal-title-input" placeholder="e.g. Mountain View Trailhead" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 tracking-wider mb-1">Description / Details</label>
                            <textarea id="modal-desc-input" rows="3" placeholder="Add trail details, elevation, or notes..." class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                        </div>

                        <button id="save-location-btn" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg text-sm transition-colors shadow-sm">
                            Save Location
                        </button>
                    </div>
                </div>

            </section>

        </main>

    </div>

    <!-- Custom Application JavaScript -->
    <script src="{% static 'js/home/main.js' %}"></script>
    <script src="{% static 'js/home/home.js' %}"></script>

</body>
</html>
