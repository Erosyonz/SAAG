{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SA-AG - Welcome</title>
        
        <!-- Load Tailwind CDN First -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Custom Tailwind Theme Configuration (Must load AFTER Tailwind CDN) -->
        <script src="{% static 'js/home/home.js' %}"></script>

        <!-- Font Awesome & Custom CSS -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/home/home.css' %}">

        <!-- Custom Stylesheet -->
        <link rel="stylesheet" href="{% static 'css/home/home.css' %}">
    </head>
    <body class="bg-trail-hero min-h-screen flex items-center justify-center p-4">

        <!-- Welcome Card -->
        <div class="w-full max-w-md glass-card rounded-3xl p-8 sm:p-10 text-center space-y-6 border border-white/20 relative">
            
            <!-- Quick Navigation Badges (Top Right) -->
            <div class="absolute top-6 right-6 flex items-center gap-2">
                <a href="{% url 'profile' %}" title="View Profile" class="w-10 h-10 bg-white/80 hover:bg-white text-forest-800 rounded-xl flex items-center justify-center shadow-sm hover:shadow transition-all border border-slate-100">
                    <i class="fa-solid fa-user"></i>
                </a>
                <a href="{% url 'user_settings' %}" title="Settings" class="w-10 h-10 bg-white/80 hover:bg-white text-slate-600 hover:text-forest-800 rounded-xl flex items-center justify-center shadow-sm hover:shadow transition-all border border-slate-100">
                    <i class="fa-solid fa-gear"></i>
                </a>
            </div>

            <!-- Logo Badge -->
            <div class="inline-flex items-center justify-center w-16 h-16 bg-forest-800 text-amber-400 rounded-2xl text-2xl shadow-md">
                <i class="fa-solid fa-tree"></i>
            </div>

            <!-- Welcome Message -->
            <div class="space-y-2">
                <h1 class="text-3xl font-bold text-forest-900">Welcome back, {{ request.user.username|default:"Hiker" }}!</h1>
                <p class="text-gray-600 text-base">You are successfully logged into <span class="font-semibold text-forest-800">SAAG</span>.</p>
            </div>

            <!-- Divider -->
            <div class="border-t border-gray-200"></div>

            <!-- Actions Section -->
            <div class="space-y-3">
                <!-- Profile Redirect Button -->
                <a href="{% url 'profile' %}" class="w-full inline-flex items-center justify-center gap-2.5 px-6 py-3.5 bg-forest-800 hover:bg-forest-900 text-white font-semibold rounded-xl transition duration-200 shadow-md">
                    <i class="fa-solid fa-id-card"></i>
                    <span>View Profile</span>
                </a>

                <!-- User Settings Button -->
                <a href="{% url 'user_settings' %}" class="w-full inline-flex items-center justify-center gap-2.5 px-6 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition duration-200 border border-slate-200/80 shadow-sm">
                    <i class="fa-solid fa-gear"></i>
                    <span>Account Settings</span>
                </a>

                <!-- Log Out Action -->
                <a href="{% url 'logout' %}" class="w-full inline-flex items-center justify-center gap-2.5 px-6 py-3.5 bg-terracotta-500 hover:bg-terracotta-600 text-white font-semibold rounded-xl transition duration-200 shadow-md">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Log Out</span>
                </a>
            </div>

        </div>
    </body>
</html>
