
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SA-AG - Interactive Trail Map</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Mapbox CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css"
          rel="stylesheet" />

    <!-- Mapbox JavaScript -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{% static 'css/home/home.css' %}">

    <!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<!-- Leaflet JavaScript -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

</head>

<body class="bg-gray-100 min-h-screen font-sans text-slate-800">

    <!-- Main Application Layout -->
    <div class="flex h-screen w-full overflow-hidden bg-gray-100">

        <!-- SIDEBAR -->
        <aside id="sidebar-header"
            class="bg-black text-white w-16 shrink-0 flex flex-col justify-between fixed md:relative inset-y-0 left-0 z-30 transition-transform duration-300 ease-in-out -translate-x-full md:translate-x-0">

            <div>

                <!-- Brand Header -->
                <div class="flex items-center justify-between pb-6 mb-6 border-b border-gray-800">

                    <!-- Mobile Close Button -->
                    <button id="close-sidebar-btn"
                        class="md:hidden text-gray-400 hover:text-white focus:outline-none">

                        <svg xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            class="size-6">

                            <path stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M6 18 18 6M6 6l12 12" />

                        </svg>

                    </button>

                </div>

                <!-- Navigation Links -->
                <nav class="space-y-2">

                    <!-- Home -->
                    <a href="#home"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors"
                        data-page="home">

                        <svg xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            class="size-6 shrink-0">

                            <path stroke-linecap="round"
                                stroke-linejoin="round"
                                d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />

                        </svg>

                    </a>

                    <!-- Map Shortcut (Returns to Home Map) -->
                    <a href="#home"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors"
                        data-page="home">

                        <svg xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            class="size-6 shrink-0">

                            <path stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M9 6.75V15m6-6v8.25m.503-11.487 4.5 1.744a.75.75 0 0 1 .497.702v12.247a.75.75 0 0 1-.996.711l-4.5-1.744a.75.75 0 0 0-.504 0l-4.5 1.744a.75.75 0 0 1-.497-.702V4.225a.75.75 0 0 1 .996-.711l4.5 1.744a.75.75 0 0 0 .504 0Z" />

                        </svg>

                    </a>

                    <!-- Profile -->
                    <a href="#profile"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors"
                        data-page="profile">

                        <svg xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            class="size-6 shrink-0">

                            <path stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />

                        </svg>

                    </a>

                </nav>

            </div>

            <!-- Sidebar Footer -->
            <div class="pt-4 border-t border-gray-800 text-xs text-gray-500 p-2">
                &copy; SAAG
            </div>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="flex-1 min-w-0 h-full overflow-hidden m-0 p-0">

            <!-- HOME PAGE -->
            <section id="view-home"
                class="page-view flex flex-col w-full h-full min-w-0 relative overflow-hidden">
                            
                <!-- Map Container filling 100% -->
                <div id="mapbox-container"
                    class="w-full h-full absolute inset-0">
                </div>

                <!-- Satellite Mode Indicator -->
                <div class="absolute top-4 left-4 z-[400] bg-black/80 backdrop-blur-md text-white text-xs px-3 py-2 rounded-full pointer-events-none border border-white/10 shadow-lg flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Satellite Mode Active
                </div>

                <!-- MOVED OUTSIDE: Button to Toggle Heroes Overlay -->
                <button id="open-heroes-btn" class="absolute top-16 left-4 z-[400] bg-white/90 hover:bg-white text-slate-800 text-xs font-semibold px-3 py-2 rounded-lg shadow-lg backdrop-blur-md border border-gray-200 transition-colors pointer-events-auto flex items-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 text-emerald-600">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
                    </svg>
                    Heroes
                </button>

                <!-- RIGHT SIDE OVERLAY MODAL -->
                <div id="location-modal" class="absolute top-0 right-0 h-full w-96 bg-white/95 backdrop-blur-md shadow-2xl z-[1000] transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col border-l border-gray-200 pointer-events-auto">
                    <!-- ... modal content ... -->
                </div>

                <!-- HEROES OVERLAY PANEL -->
                <div id="heroes-modal" class="absolute top-0 left-0 h-full w-80 bg-white/95 backdrop-blur-md shadow-2xl z-[1000] transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col border-r border-gray-200 pointer-events-auto">
                    <!-- ... heroes content ... -->
                </div>

            </section>

        </main>

    </div>

    <!-- Custom Application JavaScript -->
    <script src="{% static 'js/home/main.js' %}"></script>
    <script src="{% static 'js/home/home.js' %}"></script>

</body>
</html>
