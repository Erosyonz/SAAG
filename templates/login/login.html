{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SA-AG - Sign in</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/auth/auth.css' %}">
</head>

<body class="bg-black text-white antialiased">

    <main class="min-h-screen grid lg:grid-cols-2">

        <!-- Brand side (desktop only) -->
        <aside class="trail-card-fallback hidden lg:flex flex-col justify-between p-12 border-r border-white/10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500 text-black grid place-items-center font-display font-extrabold text-sm">SA</div>
                <span class="font-display font-bold text-lg">SAAG</span>
            </div>
            <div class="max-w-md">
                <h2 class="font-display text-4xl font-bold leading-tight">Walk it. Record it. Share it.</h2>
                <p class="mt-4 text-zinc-300 leading-relaxed">Follow trails other hikers recorded, or map your own and let others walk the same line.</p>
            </div>
            <p class="text-xs text-zinc-400">&copy; SAAG</p>
        </aside>

        <!-- Form side -->
        <section class="flex items-center justify-center px-6 py-10 sm:px-12">
            <div class="w-full max-w-md">

                <div class="lg:hidden w-10 h-10 mb-6 rounded-xl bg-emerald-500 text-black grid place-items-center font-display font-extrabold text-sm">SA</div>

                <h1 class="font-display text-3xl font-bold">Welcome back</h1>
                <p class="mt-1 mb-8 text-sm text-zinc-400">Hello, Mag-Balaktasay</p>

                {% include 'includes/alerts.html' %}
                <div id="notice-area" aria-live="polite"></div>

                <form method="POST" action="{% url 'login' %}" class="space-y-5">
                    {% csrf_token %}

                    <div>
                        <label for="login-username" class="auth-label">Username</label>
                        <input id="login-username" type="text" name="username" required autocomplete="username"
                            placeholder="Your username" class="auth-input">
                    </div>

                    <div>
                        <div class="flex items-center justify-between">
                            <label for="login-pass" class="auth-label">Password</label>
                            <button id="forgot-password-btn" type="button"
                                class="mb-2 text-xs font-medium text-emerald-400 hover:text-emerald-300 transition-colors">
                                Forgot password?
                            </button>
                        </div>
                        <div class="relative">
                            <input id="login-pass" type="password" name="password" required autocomplete="current-password"
                                placeholder="Your password" class="auth-input with-eye">
                            <button type="button" data-toggle-password="login-pass" aria-label="Show password"
                                class="absolute right-3.5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white transition-colors">
                                <svg class="eye-open size-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
                                <svg class="eye-closed hidden size-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>
                            </button>
                        </div>
                    </div>

                    <label class="flex items-center gap-2 cursor-pointer text-sm text-zinc-300 select-none">
                        <input type="checkbox" name="remember_me" class="size-4 rounded accent-emerald-500">
                        <span>Keep me signed in</span>
                    </label>

                    <button type="submit"
                        class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 active:scale-[0.99] text-black rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2">
                        <span>Start exploring</span>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" /></svg>
                    </button>
                </form>

                <p class="mt-8 pt-6 border-t border-white/10 text-sm text-zinc-400 text-center">
                    Don't have an account?
                    <a href="{% url 'register' %}" class="ml-1 font-semibold text-emerald-400 hover:text-emerald-300">Sign up</a>
                </p>
            </div>
        </section>
    </main>

    <script src="{% static 'js/auth/auth.js' %}"></script>
</body>
</html>
